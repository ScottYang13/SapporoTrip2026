<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>北海道札幌 7 天 6 夜極致行程</title>

    <!-- 將 Tailwind CSS、FontAwesome 及字體直接放在主頁面 head 優先載入 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body style="margin:0; padding:0; background-color: #f1f5f9;">

    <div id="app">
        <div style="padding: 60px 20px; text-align: center; font-family: sans-serif; color: #64748b;">
            <i class="fa-solid fa-spinner fa-spin" style="font-size: 28px; color: #0284c7; margin-bottom: 12px;"></i>
            <p style="font-weight: 600; margin: 0;">行程資料載入中，請稍候...</p>
        </div>
    </div>

    <script>
        const gasApiUrl = 'https://script.google.com/macros/s/AKfycbzFRtKvX3EiI2R9UdK7EFQQDLC63r6u6IzvSy5OtwpiedbvEFAn11nOkE2dqpVD9rutoA/exec';

        fetch(gasApiUrl + '?t=' + Date.now())
            .then(res => {
                if (!res.ok) throw new Error('HTTP 狀態碼：' + res.status);
                return res.text();
            })
            .then(htmlContent => {
                const app = document.getElementById('app');
                app.innerHTML = htmlContent;

                // 重新解析並正確執行注入內容中的 <script> 標籤
                const scripts = app.querySelectorAll("script");
                scripts.forEach(oldScript => {
                    const newScript = document.createElement("script");
                    
                    // 複製所有原屬性
                    Array.from(oldScript.attributes).forEach(attr => {
                        newScript.setAttribute(attr.name, attr.value);
                    });

                    // 區分外部腳本 (有 src) 與內聯腳本 (無 src)
                    if (oldScript.src) {
                        newScript.src = oldScript.src;
                    } else {
                        newScript.textContent = oldScript.textContent;
                    }

                    // 替換舊標籤以觸發執行
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });
            })
            .catch(err => {
                document.getElementById('app').innerHTML = `
                    <div style="padding: 40px 20px; color: #ef4444; font-family: sans-serif; text-align: center;">
                        <h3 style="margin-top:0;">⚠️ 載入行程失敗</h3>
                        <p style="color: #64748b; font-size: 14px;">${err.message}</p>
                    </div>`;
            });
    </script>

</body>
</html>
